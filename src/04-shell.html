<!-- ============================================================
     APP SHELL · header + sidebar + main outlet
     ============================================================ -->
<div id="app-root" class="hide">
  <div class="offline-bar" role="alert">
    <svg class="icon" aria-hidden="true"><use href="#i-wifi-off"/></svg>
    <span data-i18n="offline.line">You are offline — showing saved data. New triage will be queued and synced.</span>
  </div>

  <header class="app-header">
    <a class="brand" href="#/home" aria-label="MediTriage AI home">
      <svg class="logo-mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="url(#lgB)"/><defs><linearGradient id="lgB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#268DD1"/><stop offset="1" stop-color="#14527D"/></linearGradient></defs><path d="M20 7c-3.2 5-3.2 9.8 0 14 3.2-4.2 3.2-9 0-14zM8.5 13.5c1.8 6 6.3 9.5 11.4 9.8C18 17.4 13.6 14 8.5 13.5zm23 0c-5.1.5-9.5 3.9-11.4 9.8 5.1-.3 9.6-3.8 11.4-9.8z" fill="#fff"/><path d="M6.5 26.5h7l2.8-4.8 3.4 8 2.8-5.2h11" fill="none" stroke="#FFC107" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand__name" data-i18n="app.name">MediTriage AI</span>
    </a>

    <form class="header-search" id="global-search-form" role="search">
      <div class="input-wrap">
        <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
        <input class="input" id="global-search" data-i18n-attr="placeholder" data-i18n="search.placeholder" placeholder="Search by specialty or location" aria-label="Search doctors by specialty or location">
      </div>
    </form>

    <div class="header-actions">
      <div class="segmented" role="group" aria-label="Change language">
        <button data-lang-btn="en" aria-pressed="true" type="button" aria-label="English">EN</button>
        <button data-lang-btn="hi" aria-pressed="false" lang="hi" type="button" aria-label="हिन्दी">हिं</button>
        <button data-lang-btn="mr" aria-pressed="false" lang="mr" type="button" aria-label="मराठी">मरा</button>
      </div>
      <button class="netchip" id="net-chip" type="button" aria-label="Connectivity status. Button simulates going offline for the demo.">
        <span class="pulse-dot" aria-hidden="true"></span><span class="lbl">Online</span>
      </button>
      <button class="iconbtn" id="btn-bell" type="button" aria-label="Notifications, 3 unread" aria-haspopup="dialog">
        <svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>
        <span class="count-badge" id="bell-dot">3</span>
      </button>
      <button class="profile-btn" id="btn-profile" type="button" aria-haspopup="dialog" aria-label="Your account">
        <span class="avatar avatar--sm"><img src="assets/img/kavita.jpg" alt=""></span>
        <span class="who"><b>Kavita</b><span>Patient</span></span>
        <svg class="icon icon--sm chev" aria-hidden="true" style="color:var(--text-muted)"><use href="#i-chevron-down"/></svg>
      </button>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar" aria-label="Primary navigation">
      <span class="sidenav__label">Menu</span>
      <a class="sidenav" data-nav="home" href="#/home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg> <span data-i18n="nav.home">Home</span></a>
      <a class="sidenav" data-nav="assistant" href="#/assistant"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg> <span data-i18n="nav.assistant">AI Assistant</span> <span class="mini-badge">AI</span></a>
      <a class="sidenav" data-nav="doctors" href="#/doctors"><svg class="icon" aria-hidden="true"><use href="#i-stethoscope"/></svg> <span data-i18n="nav.doctors">Find Doctors</span></a>
      <a class="sidenav" data-nav="records" href="#/records"><svg class="icon" aria-hidden="true"><use href="#i-folder"/></svg> <span data-i18n="nav.records">Records</span></a>
      <a class="sidenav" data-nav="vitals" href="#/vitals"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg> <span data-i18n="nav.vitals">Vitals</span></a>
      <span class="sidenav__label">Care team tools</span>
      <a class="sidenav" data-nav="summary" href="#/summary"><svg class="icon" aria-hidden="true"><use href="#i-edit-2"/></svg> <span data-i18n="nav.summary">Consult Notes</span></a>
      <a class="sidenav" data-nav="admin" href="#/admin"><svg class="icon" aria-hidden="true"><use href="#i-trending-up"/></svg> <span data-i18n="nav.admin">Analytics</span></a>

      <div class="sidebar__card">
        <strong><svg class="icon icon--sm" style="color:var(--blue-600);vertical-align:-3px" aria-hidden="true"><use href="#i-headphones"/></svg> 24×7 Help desk</strong>
        <p>Hindi, Marathi &amp; English support for booking and technical help.</p>
        <a class="btn btn--secondary btn--sm btn--block" href="tel:18004208547"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg> 1800 420 8547</a>
      </div>
    </aside>

    <main class="app-main" id="main" tabindex="-1">
